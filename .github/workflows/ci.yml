name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # Root has no engine constraint, so keep its Node 20 coverage. The
        # bridge steps below require Node >=22 (engines) and run only on 22.x.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            bridge/package-lock.json
            sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # --audit-level=high scans only npm/package-lock.json dependencies, so
      # it cannot and does not need to cover pip alerts on requirements-test.txt
      # (e.g. GHSA-6w46-j5rx-g56g / Dependabot alert #39 on pytest, a
      # different ecosystem entirely). Decision: pytest is pinned to 9.0.3
      # in requirements-test.txt, which is the first patched version for
      # that alert, so no separate pip-audit step was added here.
      - name: Audit (fail on high or critical)
        run: npm audit --audit-level=high

      # sdk has no engine floor above the matrix's own Node versions, so its
      # steps run on both legs (same as root).
      - name: Install sdk dependencies
        working-directory: sdk
        run: npm ci

      - name: Type check sdk
        working-directory: sdk
        run: npm run lint

      - name: Type check sdk test files
        working-directory: sdk
        run: npm run lint:test

      - name: Test sdk with coverage
        working-directory: sdk
        run: npm run test:coverage

      - name: Build sdk
        working-directory: sdk
        run: npm run build

      # bridge requires Node >=22 (engines), so its steps run only on the 22.x leg.
      - name: Install bridge dependencies
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm ci

      - name: Type check bridge
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm run typecheck

      - name: Type check bridge test files
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm run typecheck:test

      - name: Test bridge with coverage
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm run test:coverage

      - name: Build bridge
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm run build

      - name: Audit bridge (fail on high or critical)
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm audit --audit-level=high

      - name: Audit sdk (fail on high or critical)
        if: matrix.node-version == '22.x'
        working-directory: sdk
        run: npm audit --audit-level=high

      # triologue-cli.py is a standalone Python script; its pytest suite
      # only needs to run once, so it's gated to one matrix leg like the
      # bridge/sdk audit steps above.
      - name: Setup Python
        if: matrix.node-version == '22.x'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install Python test dependencies
        if: matrix.node-version == '22.x'
        run: pip install -r requirements-test.txt

      - name: Test triologue-cli.py
        if: matrix.node-version == '22.x'
        run: python -m pytest tests/ -v
