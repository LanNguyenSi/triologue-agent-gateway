name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # Bound for the whole job: the audit steps carry their own 2+5 minute
    # step budgets, and the tsc/test/build/pytest steps finish well inside
    # this cap on recent runs (see PR body); the incident-class hang is the
    # only thing that reached a job timeout here.
    timeout-minutes: 30
    
    strategy:
      matrix:
        # Root has no engine constraint, so cover Node 22 (production) and 24. The
        # bridge steps below require Node >=22 (engines) and run only on 22.x;
        # the channel steps run on both.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            bridge/package-lock.json
            channel/package-lock.json
            sdk/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # dotenv truncates an unquoted value at "#", while systemd
      # EnvironmentFile and docker --env-file keep a trailing "# ..." as part
      # of the value, so no assignment line may contain a "#" after the "=".
      - name: Check .env.example has no trailing comments
        run: |
          if [ ! -f .env.example ]; then
            echo "::error::.env.example is missing"
            exit 1
          fi
          status=0
          grep -nE '^[[:space:]]*(export[[:space:]]+)?[A-Za-z_][A-Za-z0-9_]*=.*#' .env.example || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::.env.example value line contains '#': systemd/docker keep it as part of the value and dotenv truncates there"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::grep failed on .env.example (exit $status)"
            exit 1
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # --audit-level=high scans only npm/package-lock.json dependencies, so
      # it cannot and does not need to cover pip alerts on requirements-test.txt
      # (e.g. GHSA-6w46-j5rx-g56g / Dependabot alert #39 on pytest, a
      # different ecosystem entirely). Decision: pytest is pinned to 9.0.3
      # in requirements-test.txt, which is the first patched version for
      # that alert, so no separate pip-audit step was added here.
      #
      # Gate step outcomes (incident 2026-09-04: the registry's advisories/bulk
      # endpoint stopped answering for hours; npm's own client applies no
      # timeout to that call and just hangs). Every gate step (root, bridge,
      # sdk, channel) calls scripts/ci/run-audit-gate.sh, which captures
      # `npm audit --audit-level=high --json` under a 60 s bound and hands it
      # to scripts/ci/audit-gate.mjs (dependency-free; its self-test, the
      # "audit gate self-test" step below, runs before the first gate). The
      # classifier has four distinct outcomes, never conflated:
      #   - exit 0, CLEAN: the endpoint answered, no HIGH or CRITICAL advisory
      #     remains after the allowlist below. An advisory covered by an
      #     allowlist entry counts as clean; the entries used are printed.
      #   - exit 1, FINDINGS: the endpoint answered and returned a HIGH or
      #     CRITICAL advisory that no allowlist entry covers (listed per
      #     package), or an allowlist entry's reviewBy date is before today
      #     (UTC), even when the advisory is gone. A real report always wins
      #     over outage-like text elsewhere in the log, so a real finding can
      #     never be misread as an outage.
      #   - exit 2, OUTAGE: no audit report, but an outage marker is present
      #     (registry error text, a DNS/connection failure, or the local
      #     timeout firing). This is NOT an advisory finding; do not silence
      #     it with `|| true`, the fix is to retry the job later once the
      #     endpoint is back.
      #   - exit 3, UNCLASSIFIED: npm audit failed but the output is neither a
      #     report nor an outage marker (for example a missing lockfile, or a
      #     wrong working-directory), the allowlist file is unreadable or
      #     malformed, the report is inconsistent, or the classifier exited 0
      #     without printing its CLEAN line. Treated as a real failure, not
      #     silenced; read the log.
      # The report step below is bounded the same way (a step timeout plus an
      # internal `timeout`) so a hanging endpoint cannot eat the job's
      # timeout-minutes budget before this gate step, which does the actual
      # classification, ever gets to run.
      #
      # Allowlist (.github/audit-allowlist.json): the only way to except an
      # advisory that has no upstream fix. Each entry is { id, reason, reviewBy }
      # with an exact GHSA id (matched against the advisory url in npm's JSON,
      # never by severity or package name) and a YYYY-MM-DD review date; the
      # entry stops passing the gate the day after reviewBy, so a renewal needs
      # a commit with a recorded reason. reviewBy may lie at most 90 days after
      # today (UTC). A package counts as excepted only when every HIGH/CRITICAL
      # advisory in its dependency chain is allowlisted. One file serves all
      # four lockfile trees; an entry that matches nothing in a tree only warns.
      - name: audit gate self-test
        timeout-minutes: 2
        run: node --test scripts/ci/audit-gate.test.mjs
      - name: npm audit (full report, non-blocking)
        timeout-minutes: 2
        run: timeout 60s npm audit --no-fund || true
      - name: Audit (fail on high or critical)
        timeout-minutes: 5
        run: bash "$GITHUB_WORKSPACE/scripts/ci/run-audit-gate.sh"

      # sdk has no engine floor above the matrix's own Node versions, so its
      # steps run on both legs (same as root).
      - name: Install sdk dependencies
        working-directory: sdk
        run: npm ci --no-audit --no-fund

      - name: Type check sdk
        working-directory: sdk
        run: npm run lint

      - name: Type check sdk test files
        working-directory: sdk
        run: npm run lint:test

      - name: Test sdk with coverage
        working-directory: sdk
        run: npm run test:coverage

      - name: Build sdk
        working-directory: sdk
        run: npm run build

      # bridge requires Node >=22 (engines), so its steps run only on the 22.x leg.
      - name: Install bridge dependencies
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm ci --no-audit --no-fund

      - name: Type check bridge
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm run typecheck

      - name: Type check bridge test files
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm run typecheck:test

      - name: Test bridge with coverage
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm run test:coverage

      - name: Build bridge
        if: matrix.node-version == '22.x'
        working-directory: bridge
        run: npm run build

      # channel requires Node >=22 (engines), which both legs satisfy, so its
      # steps run on 22.x and 24.x: dist/ is not committed, CI is where it is
      # built.
      - name: Install channel dependencies
        working-directory: channel
        run: npm ci --no-audit --no-fund

      - name: Type check channel
        working-directory: channel
        run: npm run typecheck

      - name: Type check channel test files
        working-directory: channel
        run: npm run typecheck:test

      - name: Test channel with coverage
        working-directory: channel
        run: npm run test:coverage

      - name: Build channel
        working-directory: channel
        run: npm run build

      # Same bounded report + classifying gate as the root "Audit" step above
      # (exit 0 CLEAN / 1 FINDINGS / 2 OUTAGE / 3 UNCLASSIFIED); the audit
      # result depends on the lockfile only, so one leg is enough, as for
      # bridge and sdk below.
      - name: npm audit channel (full report, non-blocking)
        if: matrix.node-version == '22.x'
        working-directory: channel
        timeout-minutes: 2
        run: timeout 60s npm audit --no-fund || true
      - name: Audit channel (fail on high or critical)
        if: matrix.node-version == '22.x'
        working-directory: channel
        timeout-minutes: 5
        run: bash "$GITHUB_WORKSPACE/scripts/ci/run-audit-gate.sh"

      # Same bounded report + classifying gate as the root "Audit" step
      # above (exit 0 CLEAN / 1 FINDINGS / 2 OUTAGE / 3 UNCLASSIFIED); see
      # that step's comment for the full outcome breakdown.
      - name: npm audit bridge (full report, non-blocking)
        if: matrix.node-version == '22.x'
        working-directory: bridge
        timeout-minutes: 2
        run: timeout 60s npm audit --no-fund || true
      - name: Audit bridge (fail on high or critical)
        if: matrix.node-version == '22.x'
        working-directory: bridge
        timeout-minutes: 5
        run: bash "$GITHUB_WORKSPACE/scripts/ci/run-audit-gate.sh"

      # Same bounded report + classifying gate as the root "Audit" step
      # above (exit 0 CLEAN / 1 FINDINGS / 2 OUTAGE / 3 UNCLASSIFIED); see
      # that step's comment for the full outcome breakdown.
      - name: npm audit sdk (full report, non-blocking)
        if: matrix.node-version == '22.x'
        working-directory: sdk
        timeout-minutes: 2
        run: timeout 60s npm audit --no-fund || true
      - name: Audit sdk (fail on high or critical)
        if: matrix.node-version == '22.x'
        working-directory: sdk
        timeout-minutes: 5
        run: bash "$GITHUB_WORKSPACE/scripts/ci/run-audit-gate.sh"

      # triologue-cli.py is a standalone Python script; its pytest suite
      # only needs to run once, so it's gated to one matrix leg like the
      # bridge/sdk audit steps above.
      - name: Setup Python
        if: matrix.node-version == '22.x'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install Python test dependencies
        if: matrix.node-version == '22.x'
        run: pip install -r requirements-test.txt

      - name: Test triologue-cli.py
        if: matrix.node-version == '22.x'
        run: python -m pytest tests/ -v
