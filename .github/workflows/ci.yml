          exit 3

      # triologue-cli.py is a standalone Python script; its pytest suite
      # only needs to run once, so it's gated to one matrix leg like the
      # bridge/sdk audit steps above.
      - name: Setup Python
        if: matrix.node-version == '22.x'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-test.txt

      - name: Install Python test dependencies
        if: matrix.node-version == '22.x'
        run: pip install -r requirements-test.txt

      - name: Test triologue-cli.py
        if: matrix.node-version == '22.x'
        run: python -m pytest tests/ -v
